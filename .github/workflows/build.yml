name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inject Supabase values from secrets
        run: |
          sed -i "s|YOUR-PROJECT-REF.supabase.co|${{ secrets.SB_URL }}|" \
            app/src/main/java/com/benign/notes/Beacon.java
          sed -i "s|YOUR-ANON-PUBLIC-KEY|${{ secrets.SB_KEY }}|" \
            app/src/main/java/com/benign/notes/Beacon.java
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}

      - name: Build
        uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beacon-apk
          path: app/build/outputs/apk/debug/app-debug.apk
